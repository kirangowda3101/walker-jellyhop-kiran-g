<text x="24" y="500" font-size="15" fill="#111" text-anchor="start" font-weight="normal">Pink dashed line = eye line, 24 px below the top. Highlight is top-center in every view, so a flip looks identical; facing shows through the +3 px face offset and the lean.</text>
