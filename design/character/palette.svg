<rect x="820" y="100" width="60" height="32" fill="#3CCFC4" stroke="#999"/><text x="892" y="122" font-size="15" fill="#111" text-anchor="start" font-weight="normal">jelly  #3CCFC4</text>
<rect x="820" y="144" width="60" height="32" fill="#1F8E92" stroke="#999"/><text x="892" y="166" font-size="15" fill="#111" text-anchor="start" font-weight="normal">shade  #1F8E92</text>
<rect x="820" y="188" width="60" height="32" fill="#E8FFFA" stroke="#999"/><text x="892" y="210" font-size="15" fill="#111" text-anchor="start" font-weight="normal">highlight  #E8FFFA</text>
<rect x="820" y="232" width="60" height="32" fill="#0F3440" stroke="#999"/><text x="892" y="254" font-size="15" fill="#111" text-anchor="start" font-weight="normal">outline  #0F3440</text>
<text x="1050" y="84" font-size="16" fill="#111" text-anchor="start" font-weight="bold">Environment (placeholders)</text>
<rect x="1050" y="100" width="60" height="32" fill="#B4472A" stroke="#999"/><text x="1122" y="122" font-size="15" fill="#111" text-anchor="start" font-weight="normal">sauce  #B4472A</text>
<rect x="1050" y="144" width="60" height="32" fill="#2A2320" stroke="#999"/><text x="1122" y="166" font-size="15" fill="#111" text-anchor="start" font-weight="normal">table  #2A2320</text>
<rect x="1050" y="188" width="60" height="32" fill="#E9E4DA" stroke="#999"/><text x="1122" y="210" font-size="15" fill="#111" text-anchor="start" font-weight="normal">plate  #E9E4DA</text>
<rect x="1050" y="232" width="60" height="32" fill="#9AA2A9" stroke="#999"/><text x="1122" y="254" font-size="15" fill="#111" text-anchor="start" font-weight="normal">fork  #9AA2A9</text>
<rect x="1050" y="276" width="60" height="32" fill="#1B1716" stroke="#999"/><text x="1122" y="298" font-size="15" fill="#111" text-anchor="start" font-weight="normal">room  #1B1716</text>
<text x="24" y="370" font-size="16" fill="#111" text-anchor="start" font-weight="bold">Contrast ratios (WCAG formula; higher = easier to tell apart)</text>
<text x="24" y="402" font-size="15" fill="#111" text-anchor="start" font-weight="normal">jelly vs table: 8.0 : 1</text>
<text x="424" y="402" font-size="15" fill="#111" text-anchor="start" font-weight="normal">jelly vs room: 9.2 : 1</text>
<text x="24" y="430" font-size="15" fill="#111" text-anchor="start" font-weight="normal">jelly vs plate: 1.5 : 1</text>
<text x="424" y="430" font-size="15" fill="#111" text-anchor="start" font-weight="normal">outline vs plate: 10.5 : 1</text>
<text x="24" y="458" font-size="15" fill="#111" text-anchor="start" font-weight="normal">jelly vs fork: 1.3 : 1</text>
<text x="424" y="458" font-size="15" fill="#111" text-anchor="start" font-weight="normal">outline vs fork: 5.1 : 1</text>
<text x="24" y="486" font-size="15" fill="#111" text-anchor="start" font-weight="normal">jelly vs sauce: 2.8 : 1</text>
<text x="424" y="486" font-size="15" fill="#111" text-anchor="start" font-weight="normal">sauce vs table: 2.9 : 1</text>
<text x="24" y="530" font-size="15" fill="#111" text-anchor="start" font-weight="normal">Reading: the jelly body carries it on the dark table and room; on pale plates and next to the steel fork the dark outline</text>
<text x="24" y="552" font-size="15" fill="#111" text-anchor="start" font-weight="normal">carries it, so the outline must never be dropped or thinned. Sauce differs from the jelly mainly by hue (warm red vs cool aqua).</text>
<text x="24" y="590" font-size="14" fill="#555" text-anchor="start" font-weight="normal">Environment colors are placeholders for this check only; the final environment palette is not decided yet.</text>
</svg>
